<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行时状态与数据流 · 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #FAF8F5;
      --color-ink:    #1A1A1A;
      --color-muted:  #555555;
      --color-soft:   #6B6B6B;
      --color-accent: #C44536;
      --color-link:   #2E5AA8;
      --font-sans:    'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>运行时状态与数据流</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dataflow-title dataflow-desc">
        <title id="dataflow-title">运行时状态与数据流</title>
        <desc id="dataflow-desc">localStorage 与两个 Provider 驱动客户端页面，cookie 驱动服务端页面；config、data 与博客文件在构建期输入。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C44536"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FAF8F5"/>

        <!-- Zones -->
        <rect x="40" y="88" width="240" height="320" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <rect x="52" y="92" width="64" height="12" rx="2" fill="#FAF8F5"/>
        <text x="84" y="101" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNTIME</text>

        <rect x="340" y="88" width="280" height="400" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <rect x="352" y="92" width="48" height="12" rx="2" fill="#FAF8F5"/>
        <text x="376" y="101" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PAGES</text>

        <rect x="680" y="88" width="240" height="400" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <rect x="692" y="92" width="56" height="12" rx="2" fill="#FAF8F5"/>
        <text x="720" y="101" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INPUTS</text>

        <!-- Runtime store <-> provider (behind nodes) -->
        <line x1="140" y1="200" x2="140" y2="232" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="172" y1="232" x2="172" y2="200" stroke="#555555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="180" y="210" width="40" height="12" rx="2" fill="#FAF8F5"/>
        <text x="200" y="219" fill="#555555" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>

        <!-- Providers -> client pages -->
        <path d="M 256,264 H 328 Q 336,264 336,256 V 232 Q 336,224 344,224 H 380" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 256,360 H 340 Q 348,360 348,352 V 256 Q 348,248 356,248 H 380" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Locale cookie -> server pages (dashed) -->
        <path d="M 256,376 H 304 Q 312,376 312,368 H 380" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Inputs -> pages -->
        <path d="M 704,168 H 660 Q 652,168 652,176 V 200 Q 652,208 644,208 H 580" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 704,184 H 672 Q 664,184 664,192 V 344 Q 664,352 656,352 H 580" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 704,264 H 696 Q 688,264 688,256 V 240 Q 688,232 680,232 H 580" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="704" y1="376" x2="580" y2="376" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Node: localStorage -->
        <rect x="64" y="136" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="64" y="136" width="192" height="64" rx="6" fill="rgba(26,26,26,0.05)" stroke="#555555" stroke-width="1"/>
        <rect x="72" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(85,85,85,0.50)" stroke-width="0.8"/>
        <text x="92" y="153" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="160" y="174" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">本地偏好</text>
        <text x="160" y="190" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localStorage</text>

        <!-- Node: HomeStyleProvider (focal) -->
        <rect x="64" y="232" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="64" y="232" width="192" height="64" rx="6" fill="rgba(196,69,54,0.08)" stroke="#C44536" stroke-width="1"/>
        <rect x="72" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(196,69,54,0.50)" stroke-width="0.8"/>
        <text x="88" y="249" fill="#C44536" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTX</text>
        <text x="160" y="270" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">风格状态</text>
        <text x="160" y="286" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HomeStyleProvider</text>

        <!-- Node: LocaleProvider -->
        <rect x="64" y="328" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="64" y="328" width="192" height="64" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="72" y="336" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="96" y="345" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCALE</text>
        <text x="160" y="366" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">语言状态</text>
        <text x="160" y="382" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LocaleProvider</text>

        <!-- Node: Client pages -->
        <rect x="380" y="184" width="200" height="80" rx="6" fill="#FAF8F5"/>
        <rect x="380" y="184" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="388" y="192" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="406" y="201" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
        <text x="480" y="232" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">客户端页面</text>
        <text x="480" y="248" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">home · resume · showcase</text>

        <!-- Node: Server pages -->
        <rect x="380" y="328" width="200" height="80" rx="6" fill="#FAF8F5"/>
        <rect x="380" y="328" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="388" y="336" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="406" y="345" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
        <text x="480" y="376" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">服务端页面</text>
        <text x="480" y="392" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blog · sitemap · OG</text>

        <!-- Node: config -->
        <rect x="704" y="136" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="704" y="136" width="192" height="64" rx="6" fill="rgba(85,85,85,0.10)" stroke="#6B6B6B" stroke-width="1"/>
        <rect x="712" y="144" width="48" height="12" rx="2" fill="transparent" stroke="rgba(107,107,107,0.50)" stroke-width="0.8"/>
        <text x="736" y="153" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>
        <text x="800" y="174" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">站点配置</text>
        <text x="800" y="190" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config/*.ts</text>

        <!-- Node: data -->
        <rect x="704" y="232" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="704" y="232" width="192" height="64" rx="6" fill="rgba(85,85,85,0.10)" stroke="#6B6B6B" stroke-width="1"/>
        <rect x="712" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(107,107,107,0.50)" stroke-width="0.8"/>
        <text x="728" y="249" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="800" y="270" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">简历数据</text>
        <text x="800" y="286" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/*.ts</text>

        <!-- Node: content -->
        <rect x="704" y="328" width="192" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="704" y="328" width="192" height="64" rx="6" fill="rgba(26,26,26,0.05)" stroke="#555555" stroke-width="1"/>
        <rect x="712" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(85,85,85,0.50)" stroke-width="0.8"/>
        <text x="726" y="345" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MD</text>
        <text x="800" y="366" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">博客文章</text>
        <text x="800" y="382" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">content/blog/*.md</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#555555" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="566" width="14" height="10" rx="2" fill="rgba(196,69,54,0.08)" stroke="#C44536" stroke-width="1"/>
        <text x="60" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Focal state</text>

        <rect x="170" y="566" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <text x="190" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Provider / page</text>

        <rect x="360" y="566" width="14" height="10" rx="2" fill="rgba(26,26,26,0.05)" stroke="#555555" stroke-width="1"/>
        <text x="380" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="490" y="566" width="14" height="10" rx="2" fill="rgba(85,85,85,0.10)" stroke="#6B6B6B" stroke-width="1"/>
        <text x="510" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <line x1="620" y1="571" x2="648" y2="571" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="656" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

        <line x1="760" y1="571" x2="788" y2="571" stroke="#555555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="796" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Cookie / async</text>
      </svg>
    </div>
  </div>
</body>
</html>
