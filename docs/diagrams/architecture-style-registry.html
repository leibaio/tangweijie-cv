<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页风格注册表 · 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #FAF8F5;
      --color-ink:    #1A1A1A;
      --color-muted:  #555555;
      --color-soft:   #6B6B6B;
      --color-accent: #C44536;
      --color-link:   #2E5AA8;
      --font-sans:    'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>首页风格注册表</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="registry-title registry-desc">
        <title id="registry-title">首页风格注册表</title>
        <desc id="registry-desc">HomeStyle 联合类型驱动头部主题、组件映射与简历主题三份穷举注册表，并最终渲染首页与简历页。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C44536"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#FAF8F5"/>

        <!-- Zones -->
        <rect x="40" y="192" width="880" height="124" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <rect x="52" y="196" width="88" height="12" rx="2" fill="#FAF8F5"/>
        <text x="96" y="205" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">REGISTRIES</text>

        <rect x="200" y="332" width="600" height="132" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <rect x="700" y="336" width="80" height="12" rx="2" fill="#FAF8F5"/>
        <text x="740" y="345" fill="#6B6B6B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSUMERS</text>

        <!-- Fan-out bus from HomeStyle (behind nodes) -->
        <line x1="480" y1="152" x2="480" y2="180" stroke="#555555" stroke-width="1.2"/>
        <line x1="162" y1="180" x2="594" y2="180" stroke="#555555" stroke-width="1.2"/>
        <line x1="162" y1="180" x2="162" y2="220" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="378" y1="180" x2="378" y2="220" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="594" y1="180" x2="594" y2="220" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Registries -> consumers -->
        <path d="M 162,284 V 336 Q 162,344 170,344 H 292 Q 300,344 300,352 V 360" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="378" y1="284" x2="378" y2="360" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="594" y1="284" x2="594" y2="360" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Theme also feeds Resume; hops over the two vertical drops -->
        <path d="M 210,284 V 320 H 370 a 8,8 0 0,1 16,0 H 586 a 8,8 0 0,1 16,0 H 620 V 360" fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Node: HomeStyle -->
        <rect x="400" y="88" width="160" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="400" y="88" width="160" height="64" rx="6" fill="rgba(196,69,54,0.08)" stroke="#C44536" stroke-width="1"/>
        <rect x="408" y="96" width="36" height="12" rx="2" fill="transparent" stroke="rgba(196,69,54,0.50)" stroke-width="0.8"/>
        <text x="426" y="105" fill="#C44536" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="480" y="126" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">风格定义</text>
        <text x="480" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HomeStyle · 13 keys</text>

        <!-- Node: theme.ts -->
        <rect x="64" y="220" width="196" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="64" y="220" width="196" height="64" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="72" y="228" width="40" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="92" y="237" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THEME</text>
        <text x="162" y="258" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">头部主题</text>
        <text x="162" y="274" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">header · icon · dark</text>

        <!-- Node: registry.ts -->
        <rect x="280" y="220" width="196" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="280" y="220" width="196" height="64" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="288" y="228" width="32" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="304" y="237" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAP</text>
        <text x="378" y="258" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">组件映射</text>
        <text x="378" y="274" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">map · component</text>

        <!-- Node: resume-style.ts -->
        <rect x="496" y="220" width="196" height="64" rx="6" fill="#FAF8F5"/>
        <rect x="496" y="220" width="196" height="64" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="504" y="228" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="528" y="237" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESUME</text>
        <text x="594" y="258" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">简历主题</text>
        <text x="594" y="274" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vars · paper · toolbar</text>

        <!-- Node: Home page -->
        <rect x="240" y="360" width="220" height="80" rx="6" fill="#FAF8F5"/>
        <rect x="240" y="360" width="220" height="80" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="248" y="368" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="266" y="377" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
        <text x="350" y="402" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">首页</text>
        <text x="350" y="418" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">page.tsx · HomeHeader</text>

        <!-- Node: Resume page -->
        <rect x="540" y="360" width="220" height="80" rx="6" fill="#FAF8F5"/>
        <rect x="540" y="360" width="220" height="80" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <rect x="548" y="368" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
        <text x="566" y="377" fill="#555555" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGE</text>
        <text x="650" y="402" fill="#1A1A1A" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">简历页</text>
        <text x="650" y="418" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wrapper · toolbar</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#555555" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="566" width="14" height="10" rx="2" fill="rgba(196,69,54,0.08)" stroke="#C44536" stroke-width="1"/>
        <text x="60" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Focal style</text>

        <rect x="170" y="566" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
        <text x="190" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Registry / page</text>

        <line x1="360" y1="571" x2="388" y2="571" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="396" y="575" fill="#555555" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>
      </svg>
    </div>
  </div>
</body>
</html>
